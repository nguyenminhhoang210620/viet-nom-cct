# Cấu hình mặc định, khớp Bảng 4.2 / 4.3 trong báo cáo tham khảo
# (25D2KLTTNT03_BaoCao.pdf — Tống Trọng Tâm, 2026).
# Sửa lại các đường dẫn/siêu tham số tuỳ nhu cầu; đây chỉ là điểm khởi đầu.

# --- Hệ chữ đang xử lý: "han" hoặc "nom" (mỗi hệ một mô hình riêng, Mục 4.1.3) ---
script: nom

# --- Đường dẫn dữ liệu thô (đầu vào của scripts/prepare_data) ---
raw_dir: data/raw/nom          # đổi thành data/raw/nom khi xử lý chữ Nôm
processed_dir: data/processed/nom
checkpoint_dir: checkpoints/nom

# --- Chia tập (Mục 4.1.1) ---
split_ratios: [0.8, 0.1, 0.1]   # train, dev, test
split_seed: 42
length_bins: 10                  # số bin độ dài dùng để chia phân tầng

# --- Kiến trúc bộ mã hoá BERT (dùng chung CCT-C và CCT-D, Bảng 4.2) ---
encoder:
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  max_len: 128

# --- Bộ giải mã CCT-D (Bảng 4.2) ---
decoder:
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  beam_size: 5

# --- CCT-C: kích thước tầng ẩn MLP (Mục 3.5.1, dùng lại d_model) ---
cct_c:
  hidden_dim: 256
  dropout: 0.1

# --- Baseline Transformer cơ sở (Mục 4.3.1/4.3.2, cùng quy mô kiến trúc) ---
baseline:
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.3
  label_smoothing: 0.1
  beam_size: 5

# --- Huấn luyện CCT-C / CCT-D (cột trái Bảng 4.3) ---
train_cct:
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_schedule: cosine
  dropout: 0.1
  batch_size: 64                 # số câu / lô
  grad_accum_steps: 4
  max_epochs: 30
  early_stop_patience: 5         # số lần đánh giá không cải thiện thì dừng
  grad_clip: 1.0
  amp_dtype: bf16                # đổi thành fp16 nếu GPU không hỗ trợ bf16
  eval_every_steps: 500

# --- Huấn luyện Transformer cơ sở (cột phải Bảng 4.3) ---
train_baseline:
  optimizer: adam
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  lr_schedule: inv_sqrt
  tokens_per_batch: 4096
  max_epochs: 50
  early_stop_patience: 5
  grad_clip: null
  amp_dtype: fp16

# --- Cụm từ cố định (tuỳ chọn, Mục 3.3.2 — báo cáo cho thấy hiệu quả nhỏ/không ổn định) ---
phrase_table:
  enabled: false
  mode: none                     # none | integrated | postprocess
  path: null                     # data/raw/<script>/phrases.tsv

device: cuda                     # đổi thành cpu nếu không có GPU (chỉ nên dùng cho smoke test)
seed: 42
